<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Dream alliance card illustration</title>
  <desc id="desc">A dream alliance card with a small daily pact and whimsical task.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset="1" stop-color="#e8f4ef"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14313f"/>
      <stop offset="1" stop-color="#5d6e62"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#14313f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="38" fill="#f6c8a4"/>
  <circle cx="1022" cy="142" r="74" fill="#fff8ea" opacity="0.78"/>
  <path d="M0 592c132-52 240-62 363 0 116 58 210 66 344 0 156-76 315-67 493 36v172H0z" fill="#14313f" opacity="0.93"/>
  <g filter="url(#cardShadow)">
    <rect x="244" y="92" width="712" height="544" rx="36" fill="url(#paper)" stroke="#14313f" stroke-width="8"/>
    <rect x="298" y="151" width="604" height="90" rx="18" fill="url(#night)"/>
    <rect x="298" y="282" width="260" height="250" rx="24" fill="#d8edf0" stroke="#14313f" stroke-width="4"/>
    <rect x="596" y="292" width="254" height="44" rx="22" fill="#f2a65a"/>
    <rect x="596" y="368" width="254" height="44" rx="22" fill="#e85d4f"/>
    <rect x="596" y="444" width="254" height="44" rx="22" fill="#2e7d7a"/>
  </g>
  <text x="600" y="207" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#fff8ea">TODAY'S PACT</text>
  <g fill="#14313f">
    <text x="428" y="354" text-anchor="middle" font-family="Georgia, serif" font-size="32">Visitor</text>
    <text x="428" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="44">Late Elevator</text>
    <path d="M372 460h112M428 460v-84" stroke="#14313f" stroke-width="8" stroke-linecap="round"/>
    <text x="724" y="324" text-anchor="middle" font-family="Georgia, serif" font-size="24">REAL ADVICE</text>
    <text x="724" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#fff8ea">ODD TASK</text>
    <text x="724" y="476" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#fff8ea">BEDTIME RELEASE</text>
  </g>
  <g transform="translate(822 534) rotate(-11)">
    <rect x="0" y="0" width="182" height="74" rx="37" fill="#e85d4f"/>
    <text x="91" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="27" fill="#fff8ea">SEALED</text>
  </g>
</svg>
